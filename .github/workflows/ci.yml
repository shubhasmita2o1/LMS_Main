name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build -w @university-lms/shared

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build API
        run: npm run build -w @university-lms/api

      - name: Build Web
        run: npm run build -w @university-lms/web

      # Lint and tests will be expanded as ESLint and test suites are added
      # - name: Lint
      #   run: npm run lint
      # - name: Test
      #   run: npm run test
