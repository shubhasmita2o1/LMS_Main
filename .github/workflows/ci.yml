name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-typecheck:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          # cache disabled — corrupted npm cache can trigger exit-handler crashes

      - name: Install dependencies
        run: |
          set -e
          npm install -g npm@10.9.2
          export NODE_OPTIONS=--max-old-space-size=4096
          # Prefer a clean install; tolerate npm exit-handler bug if packages landed
          npm install --no-audit --no-fund --no-prefer-offline || echo "npm install exited non-zero; checking packages..."
          # Ensure critical packages exist (recover if install was incomplete)
          if [ ! -f node_modules/vite/package.json ]; then
            echo "vite missing — installing explicitly"
            npm install vite@5.4.8 @vitejs/plugin-react@4.3.2 -w @university-lms/web --no-audit --no-fund --save-dev
          fi
          if [ ! -f node_modules/typescript/package.json ]; then
            npm install typescript@5.6.3 -w @university-lms/web -w @university-lms/api -w @university-lms/shared --no-audit --no-fund --save-dev
          fi
          test -f node_modules/vite/package.json
          test -f node_modules/typescript/package.json
          ls -la node_modules/.bin/vite || ls -la node_modules/vite/bin/vite.js
          echo "Install OK"

      - name: Build shared package
        run: npm run build -w @university-lms/shared

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Build API
        run: npm run build -w @university-lms/api

      - name: Build Web
        run: npm run build -w @university-lms/web

      # Lint and tests will be expanded as ESLint and test suites are added
      # - name: Lint
      #   run: npm run lint
      # - name: Test
      #   run: npm run test
